name: CI

# TECH-09 : chaque push, sur n'importe quelle branche, lance lint, typecheck et tests.
on:
  push:
  pull_request:
    branches: [main]

env:
  DATABASE_URL: postgresql://keymine:keymine@localhost:5432/keymine
  SESSION_SECRET: ci-test-secret-not-for-production
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  REALTIME_PORT: 4001
  NEXT_PUBLIC_REALTIME_URL: ws://localhost:4001

jobs:
  lint-typecheck-test:
    name: Lint, typecheck & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

  build-and-e2e:
    name: Build against Postgres & run e2e tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: keymine
          POSTGRES_PASSWORD: keymine
          POSTGRES_DB: keymine
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run DB migrations
        run: bun run db:migrate

      - name: Database integration tests
        run: bun run test:db

      - name: Build (production build, fails the job on type/build errors)
        run: bun run build

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Run e2e tests
        run: bun run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
